[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eventvad-repro"
version = "0.1.0"
description = "Auditable paper reconstruction of the EventVAD baseline"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24.4,<2",
  "PyYAML>=6.0.2,<7",
  "scipy>=1.10.1,<1.13",
  "scikit-learn>=1.2.2,<1.6",
  "opencv-python>=4.6,<5",
  "transformers>=4.40,<5",
]

[project.scripts]
eventvad-repro = "eventvad_repro.cli:main"

[tool.setuptools.packages.find]
include = ["eventvad_repro*"]
where = ["."]

[tool.setuptools.package-dir]
"" = "."
