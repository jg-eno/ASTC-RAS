result_label: smoke
paths:
  persistent_root: /data/eventvad
  scratch: /data/eventvad/scratch
  # The CLI also discovers this runtime checkpoint automatically.
  model: models/VideoLLaMA2.1-7B-16F
  raft_checkpoint: /tmp/RAFT/models/raft-things.pth
resources: {preflight_stage: segmentation, free_gib: {segmentation: 12, scoring: 12}}
feature: {backend: clip_raft, clip_model: openai/clip-vit-base-patch16, clip_batch_size: 32, clip_weight: 0.75, flow_weight: 0.25, projection_seed: 42, raft_iterations: 20, max_resolution: [640, 360]}
graph: {topology: paper_reconstruction_v1_blockwise, block_size: 200, execution_tile_size: 200, clip_weight: 0.75, time_decay: 0.6, qk_dim: 64, iterations: 1, projection_seed: 42}
boundary: {mode: paper_reconstruction, smooth_seconds: 2.0, mad_multiplier: 3.0, min_gap_seconds: 2.0}
scoring: {dtype: int4, quantization: 4bit, frame_count: 16, max_new_tokens: 256, prompt: prompts/smoke_score.txt}
